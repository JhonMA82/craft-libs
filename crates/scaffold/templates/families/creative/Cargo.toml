# Standalone app generated by craft-scaffold (family: minimal).
# Copy this folder anywhere: with path-deps below it must stay inside the
# craft-libs checkout; the CLI rewrites these to git pins when --out leaves it.
[workspace]

[package]
name = "{{package-name}}"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "{{display-name}} — eframe/egui desktop app on craft-libs"
publish = false

[[bin]]
name = "{{package-name}}"
path = "src/main.rs"

[lib]
name = "{{package_underscore}}"
path = "src/lib.rs"

[dependencies]
craft-settings = { path = "{{settings-path}}" }
craft-quit = { path = "{{quit-path}}", features = ["egui", "menu"] }
craft-ui = { path = "{{ui-path}}", features = ["serde"] }
egui = { version = "0.36", default-features = false }
# glow keeps the binary small; wayland+x11 are both needed for Linux (winit backends).
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# The app installs the svg loader; craft-ui only prepares SVG bytes.
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Only the shell-golden harness uses it (SVG loader install in tests).
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Only the settings round-trip test uses it; production TOML goes through craft-settings.
toml_edit = { version = "0.25", features = ["serde"] }
# Only the shell-golden harness uses them; the app itself never renders offscreen.
egui_kittest = { version = "0.36", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
